<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>粉体粒径 P90 核算</title>
  <style>
    :root { --line:#d8dde6; --bg:#f5f7fa; --brand:#2456a6; --ok:#1a7f37; --err:#c0392b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
           background:var(--bg); color:#1f2733; line-height:1.55; }
    header { background:var(--brand); color:#fff; padding:16px 28px; }
    header h1 { margin:0; font-size:20px; }
    header p { margin:4px 0 0; font-size:13px; opacity:.85; }
    main { max-width:1080px; margin:24px auto; padding:0 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px;
            padding:18px 22px; margin-bottom:20px; }
    .card h2 { margin:0 0 12px; font-size:16px; color:var(--brand); }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    th, td { border:1px solid var(--line); padding:6px 10px; text-align:right; }
    th { background:#eef2f8; }
    td.l, th.l { text-align:left; }
    textarea { width:100%; font-family:ui-monospace,Menlo,Consolas,monospace;
               font-size:13px; padding:10px; border:1px solid var(--line); border-radius:6px; }
    input[type=text] { padding:7px 10px; border:1px solid var(--line); border-radius:6px; width:220px; }
    button { background:var(--brand); color:#fff; border:0; border-radius:6px;
             padding:9px 18px; font-size:14px; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    .flash { padding:10px 14px; border-radius:6px; margin-bottom:14px; font-size:13px; }
    .flash.ok { background:#e8f5ec; color:var(--ok); border:1px solid #b6e0c2; }
    .flash.error { background:#fdecea; color:var(--err); border:1px solid #f3c2bd; }
    .muted { color:#6b7480; font-size:12px; }
    .pill { display:inline-block; background:#eef2f8; border-radius:999px;
            padding:2px 10px; font-size:12px; margin-left:6px; }
    .bound { font-size:15px; }
    .bound b { font-size:22px; color:var(--brand); }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    @media (max-width:860px){ .grid2 { grid-template-columns:1fr; } }
    code { background:#f0f2f5; padding:1px 5px; border-radius:4px; }
    a { color:var(--brand); text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body>
<header>
  <h1>粉体实验室 · 粒径档表 P90 核算</h1>
  <p>按批号上传档表（连续整数微米闭区间）；同批补报须与已入库档表相容；勾选批次核算合并 P90 最紧上下界，全程按档计算。</p>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
