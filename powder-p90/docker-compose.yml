services:
  web:
    build: .
    container_name: powder-p90
    # 固定两个 gunicorn 工作进程（与 Dockerfile CMD 一致），用于演示跨进程并发。
    # 批号锁是文件锁，跨进程/跨线程均生效。
    command: ["gunicorn", "--workers", "2", "--bind", "0.0.0.0:8000",
              "--access-logfile", "-", "app.main:app"]
    ports:
      - "8000:8000"
    volumes:
      - powder-data:/app/data
    environment:
      POWDER_DB: /app/data/powder.db
      SECRET_KEY: demo-secret
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  powder-data:
